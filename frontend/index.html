<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef1f7" />
    <meta name="description" content="NotasApp: agenda personal y archivador seguro" />
    <meta name="application-name" content="NotasApp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NotasApp" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>NotasApp</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('notasapp.theme') || 'system';
          var legacy = { light: 'light-neumorphic', dark: 'dark-purple' };
          var preference = legacy[stored] || stored;
          var known = [
            'light-neumorphic',
            'dark-purple',
            'light-cobalt',
            'dark-aurora',
          ];
          var theme = preference;
          if (preference === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark-aurora'
              : 'light-cobalt';
          }
          if (known.indexOf(theme) === -1) theme = 'light-cobalt';
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeMode = preference;
        } catch (e) {
          document.documentElement.dataset.theme = 'light-cobalt';
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
