<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ece7df" />
    <meta name="description" content="NotasApp: agenda personal y archivador seguro" />
    <title>NotasApp</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('notasapp.theme') || 'system';
          var theme = mode;
          if (mode === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark-purple'
              : 'light-neumorphic';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themeMode = mode;
        } catch (e) {
          document.documentElement.dataset.theme = 'light-neumorphic';
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
