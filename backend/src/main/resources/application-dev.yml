spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/notas_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
  flyway:
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.notasapp: INFO
    org.hibernate.SQL: WARN
