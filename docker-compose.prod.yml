name: notas-app

# Producción: solo se publica el frontend (HTTP_PORT, default 8091).
# MySQL, MinIO, mail y backend quedan en la red interna.
# Uso:
#   cp .env.prod.example .env && completar secretos
#   docker compose -f docker-compose.prod.yml up -d --build

services:

  mysql:
    image: mysql:8.0
    container_name: notas-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-notas_db}
      MYSQL_USER: ${DB_USERNAME:-notas}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD es obligatorio}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - notas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - notas_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: notas-mailhog
    restart: unless-stopped
    networks:
      - notas_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notas-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-notas_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-notas}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://notas.programandos.site}
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_PATH: /app/storage
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      MAIL_PROVIDER: mailhog
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@notas.programandos.site}
      FRONTEND_URL: ${FRONTEND_URL:-https://notas.programandos.site}
      # Sin proveedor real de mails (MailHog interno) no se puede verificar el email.
      # Con Resend configurado, cambiar a "true".
      REQUIRE_EMAIL_VERIFICATION: "false"
      ANTIVIRUS_ENABLED: "false"
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - notas_storage:/app/storage
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - notas_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: notas-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8091}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<div id=\"root\"'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - notas_net

volumes:
  notas_mysql_data:
  notas_storage:

networks:
  notas_net:
    driver: bridge
