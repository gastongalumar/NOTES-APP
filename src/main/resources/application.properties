# ========== SERVER CONFIG ==========
server.port=8080
spring.application.name=notas-app

# ========== DATABASE CONFIG ==========
# Creará la base de datos automáticamente si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/notas_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=[REDACTED]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========== JPA / HIBERNATE ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ========== JWT CONFIG ==========
jwt.secret=[REDACTED]
jwt.expiration=86400000

# ========== LOGGING ==========
logging.level.com.notasapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ========== SPRING SECURITY ==========
spring.security.filter.order=10

# Permitir referencias circulares temporalmente (arreglar después)
spring.main.allow-circular-references=true